<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoomies | Late order watch</title>
  <style>
    :root { --red: #E4373F; --ink: #2B2D42; --muted: #6b6d78; --line: #e7e7eb; --wash: #fff5f5; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #f7f7f8; font: 16px/1.45 Arial, sans-serif; }
    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; }
    header { background: white; border-bottom: 1px solid var(--line); padding: 22px 0; }
    .logo { display: block; width: 205px; height: auto; }
    .hero { padding: 48px 0 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: -.04em; }
    .intro { margin: 0; color: var(--muted); }
    .controls { display: flex; align-items: end; gap: 16px; flex-wrap: wrap; padding: 24px; background: white; border-radius: 14px; box-shadow: 0 5px 18px #2b2d4210; }
    label { display: grid; gap: 7px; font-size: .85rem; font-weight: 700; }
    .date { min-width: 205px; color: var(--muted); font-size: 1rem; font-weight: 400; }
    input { min-height: 43px; padding: 8px 10px; border: 1px solid #c9c9d0; border-radius: 7px; color: var(--ink); font: inherit; }
    button { min-height: 43px; padding: 0 18px; border: 0; border-radius: 7px; background: var(--red); color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #c82e36; }
    #status { margin: 22px 0 14px; color: var(--muted); }
    .count { color: var(--red); font-weight: 700; }
    .table-wrap { overflow-x: auto; background: white; border-radius: 14px; box-shadow: 0 5px 18px #2b2d4210; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 15px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
    tbody tr:last-child td { border-bottom: 0; }
    .late { color: var(--red); font-weight: 700; }
    .empty { padding: 38px 20px; text-align: center; color: var(--muted); }
    footer { padding: 32px 0; color: var(--muted); font-size: .85rem; }
    @media (max-width: 520px) { .hero { padding-top: 32px; } .controls { align-items: stretch; } label, .date, input, button { width: 100%; } }
  </style>
</head>
<body>
  <header><main><img class="logo" src="zoomies-logo.svg" alt="Zoomies"></main></header>
  <main>
    <section class="hero">
      <h1>Late order watch</h1>
      <p class="intro">See the orders that were overdue and still undelivered at a selected time.</p>
    </section>
    <section class="controls" aria-label="Time selection">
      <label>Date <span class="date">16 October 2026</span></label>
      <label for="time">Check time <input id="time" type="time" value="16:10" step="60"></label>
      <button id="check" type="button">Check late orders</button>
    </section>
    <p id="status" role="status">Loading orders…</p>
    <div class="table-wrap" id="results" hidden></div>
  </main>
  <script>
    const DATE = '2026-10-16';
    let orders = [];

    // Handles quoted CSV values as well as the simple CSV currently supplied.
    function parseCsv(text) {
      const rows = [], row = []; let field = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (c === '"' && quoted && next === '"') { field += c; i++; }
        else if (c === '"') quoted = !quoted;
        else if (c === ',' && !quoted) { row.push(field); field = ''; }
        else if ((c === '\n' || c === '\r') && !quoted) {
          if (c === '\r' && next === '\n') i++;
          row.push(field); if (row.some(value => value !== '')) rows.push(row.splice(0)); field = '';
        } else field += c;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      const [headers, ...data] = rows;
      return data.map(values => Object.fromEntries(headers.map((header, i) => [header, (values[i] || '').trim()])));
    }

    // Date strings are interpreted manually so browser time-zone parsing cannot affect the result.
    function toMinutes(value) {
      const match = value.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/);
      return match ? Date.UTC(+match[1], +match[2] - 1, +match[3], +match[4], +match[5]) / 60000 : NaN;
    }
    function displayTime(value) { return value ? value.slice(11) : 'Not delivered'; }

    function render() {
      const time = document.querySelector('#time').value;
      if (!time) return;
      const checkAt = toMinutes(`${DATE} ${time}`);
      const late = orders.filter(order => {
        const promised = toMinutes(order.promised_by);
        const delivered = order.delivered_at ? toMinutes(order.delivered_at) : null;
        return promised < checkAt && (delivered === null || delivered > checkAt);
      });
      document.querySelector('#status').innerHTML = `<span class="count">${late.length}</span> late ${late.length === 1 ? 'order' : 'orders'} at ${time}.`;
      const results = document.querySelector('#results');
      results.hidden = false;
      if (!late.length) { results.innerHTML = '<div class="empty">No orders were late at this time.</div>'; return; }
      results.innerHTML = `<table><thead><tr><th>Order</th><th>Restaurant</th><th>Promised by</th><th>Delivered</th><th>Partner</th></tr></thead><tbody>${late.map(o => `<tr><td class="late">${escapeHtml(o.order_id)}</td><td>${escapeHtml(o.restaurant)}</td><td>${displayTime(o.promised_by)}</td><td>${displayTime(o.delivered_at)}</td><td>${escapeHtml(o.delivery_partner)}</td></tr>`).join('')}</tbody></table>`;
    }
    function escapeHtml(value) { const el = document.createElement('span'); el.textContent = value; return el.innerHTML; }

    document.querySelector('#check').addEventListener('click', render);
    document.querySelector('#time').addEventListener('change', render);
    fetch('orders.csv').then(response => {
      if (!response.ok) throw new Error('Could not load orders.csv');
      return response.text();
    }).then(text => { orders = parseCsv(text); render(); }).catch(() => {
      document.querySelector('#status').textContent = 'Unable to load orders.csv. Keep it beside index.html when publishing.';
    });
  </script>
</body>
</html>
